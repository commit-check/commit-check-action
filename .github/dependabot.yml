# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Same shape in every commit-check repository: monthly, one grouped pull
# request per ecosystem, `chore(deps)` commit subjects. The one exception is
# pip here, which stays daily with no cooldown: requirements.txt pins the
# commit-check release this action ships, and a new release should reach the
# action the day it is published.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    commit-message:
      prefix: chore
      include: scope
