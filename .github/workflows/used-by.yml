name: Used By

on:
  schedule:
    # https://crontab.guru/
    - cron: '0 9 * * 1' # At 09:00 on Monday.
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  used-by:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates its own push, so the token
          # is not left in .git/config for the steps in between.
          persist-credentials: false
      - uses: shenxianpeng/used-by@4c0501cd4b6370c275b50d46400538ae90b8e7a9 # v0.1.5
        with:
          repo: '${{ github.repository }}'
          update-badge: 'true'
          # used-by appends these to the shields.io query string as they are,
          # which is how the logo also carries the brand's label color. The
          # badge it writes must match README.md's byte for byte, or this job
          # opens a pull request every week that only restyles it.
          badge-color: '2c9ccd'
          badge-logo: 'github&logoColor=white&labelColor=0b1620'

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: "README.md" # the file path to commit
          commit-message: "chore: update used-by badge by github-actions[bot]"
          title: "chore: update used-by badge automatically"
          base: main
          labels: skip-changelog
          delete-branch: true
